name: Android

on:
  push:
    branches: [master, main]
    paths: ['src/**', 'android/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/android.yml']
  pull_request:
    paths: ['src/**', 'android/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-24.04  # 钉稳定镜像：Ubuntu 26 的 apt/LLVM 布局异常（libclang 装完找不到）
    steps:
      - uses: actions/checkout@v4

      - name: Install host deps (libclang, cmake)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libclang-18-dev clang-18
          # ubuntu-24.04 钉死后 LLVM 固定为 18，直接确定性指定
          ls /usr/lib/llvm-18/lib/ | grep -i clang || true
          if [ ! -e /usr/lib/llvm-18/lib/libclang-18.so.1 ]; then
            echo "!! /usr/lib/llvm-18/lib/libclang-18.so.1 不存在"; exit 1
          fi
          echo "LIBCLANG_PATH=/usr/lib/llvm-18/lib" >> "$GITHUB_ENV"

      - name: Ensure android rust targets
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          # 换前缀强制作废旧缓存（旧缓存按自装 NDK 27.0 配置，会导致 cmake 重配置踩坑）
          prefix-key: "ndk-default"

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Install uniffi-bindgen
        # uniffi crate 自带 uniffi-bindgen bin（cli feature）；uniffi-bindgen-cli 不存在
        run: cargo install uniffi --features cli --version 0.32.2

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # SDK 组件：runner 已预装 NDK（$ANDROID_NDK_ROOT）——不再自装其它版本，
      # 全链路统一预装 NDK，避免 ANDROID_NDK_HOME/ROOT 不一致触发 cmake 重配置
      - name: Install SDK components & accept licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/bin:$PATH"
          command -v sdkmanager || { echo "sdkmanager 不存在"; exit 1; }
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Build native libraries (arm64-v8a + x86_64)
        run: |
          set -o pipefail
          # 日志落盘；失败时贴到 run Summary（便于无鉴权排障）
          if cargo ndk -t arm64-v8a -t x86_64 -o android/app/src/main/jniLibs build --release --lib --no-default-features 2>&1 | tee ndk_build.log; then
            # whisper-rs 链接 c++_shared（dylib），必须随包分发，否则真机加载即闪退
            NDK_SYSROOT="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib"
            cp "$NDK_SYSROOT/aarch64-linux-android/libc++_shared.so" android/app/src/main/jniLibs/arm64-v8a/
            cp "$NDK_SYSROOT/x86_64-linux-android/libc++_shared.so" android/app/src/main/jniLibs/x86_64/
            ls -la android/app/src/main/jniLibs/*/
          else
            {
              echo '## cargo-ndk 失败日志尾部'
              echo '```'
              tail -n 120 ndk_build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Generate UniFFI Kotlin bindings
        run: |
          cargo build --release --lib --no-default-features
          uniffi-bindgen generate \
            --library target/release/libhirust_translator.so \
            --language kotlin \
            --no-format \
            --out-dir android/app/src/main/java/
          find android/app/src/main/java -name "*.kt" | head

      - name: Build APK (debug)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Gradle assembleDebug
        run: |
          cd android
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hirust-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
