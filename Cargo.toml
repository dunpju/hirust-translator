[package]
name = "hirust-translator"
version = "0.1.0"
edition = "2021"
description = "中英实时同传翻译机：说中文，实时识别翻译成英文并自动播报（美式/英式可切换）"
license = "MIT"

[lib]
name = "hirust_translator"
crate-type = ["lib", "cdylib"]

[features]
default = ["desktop"]
# 桌面专属：音频设备 + GUI + CLI 美化。
# 安卓 .so 与 UniFFI 绑定生成用 --no-default-features 构建，避免宿主系统依赖（ALSA 等）
desktop = [
    "dep:cpal",
    "dep:rodio",
    "dep:eframe",
    "dep:colored",
    "dep:indicatif",
]

[[bin]]
name = "hirust-translator"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "io-std", "io-util", "fs"] }
whisper-rs = "0.14"
msedge-tts = { version = "0.4", default-features = false, features = ["tokio-runtime"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
futures-util = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uniffi = "0.32"

# 桌面（Windows/macOS/Linux）专属依赖：音频设备、GUI、CLI 美化
[target.'cfg(not(target_os = "android"))'.dependencies]
cpal = { version = "0.15", optional = true }
rodio = { version = "0.20", default-features = false, features = ["mp3"], optional = true }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"], optional = true }
colored = { version = "2", optional = true }
indicatif = { version = "0.17", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_Foundation"] }

[profile.release]
lto = true
